<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email sheet validator</title>
<style>
:root{--bg:#eef1f4;--pan:#fff;--ink:#1b2733;--mu:#5b6b7a;--ln:#d3dae1;--acc:#1f5fbf;--er:#c62828;--erb:#fdd9d5;--erl:#fdeeec;--wa:#8a5a00;--wab:#fff0c2;--wal:#fff8e1;--ok:#1b7a3d;--okb:#d8f2e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#141a21;--pan:#1c242d;--ink:#e6ecf2;--mu:#93a3b3;--ln:#33404d;--acc:#6aa5ff;--er:#ff8a80;--erb:#4a2220;--erl:#2f1f1e;--wa:#ffd27a;--wab:#4a3a12;--wal:#2f2810;--ok:#7fdc9c;--okb:#1c3a28;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
.top{background:var(--pan);border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;flex:none}
.top h1{font-size:16px;margin:0 6px 0 0;white-space:nowrap}

.upl.on{border-color:var(--acc)}.upl.has{border-style:solid;border-color:var(--ok)}
.upl b{font-size:12px;white-space:nowrap}.upl small{color:var(--mu);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:820px){.body{grid-template-columns:1fr;grid-template-rows:minmax(0,38%) minmax(0,1fr)}.side{border-right:0;border-bottom:1px solid var(--ln)}.cfg{margin-left:0}}

/* classic card layout */
#app{padding:16px 16px 12px;max-width:1600px;margin:0 auto;width:100%}
.hd{flex:none}.hd h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 12px;max-width:80ch}
.row{display:flex;gap:12px;flex-wrap:wrap}
.pan{background:var(--pan);border:1px solid var(--ln);border-radius:8px;padding:14px}
.drop{flex:1 1 260px;border:2px dashed var(--ln);cursor:pointer;display:block;min-height:78px;position:relative}
.drop.on{border-color:var(--acc)}.drop.has{border-style:solid;border-color:var(--ok)}
.drop b{display:block}.drop small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.set{flex:1 1 300px;display:grid;gap:6px;align-content:start;padding:10px 14px}
.set label{display:grid;grid-template-columns:150px 1fr;gap:6px;align-items:center;font-size:12px;color:var(--mu)}
.bar{display:flex;align-items:center;gap:12px;margin:10px 0}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:12px}
.cols>.pan{padding:0;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pan.side{border-right:1px solid var(--ln)}
.pan.side .sp{border-bottom:1px solid var(--ln)}
.pan .tb{border-radius:8px 8px 0 0}
@media(max-width:900px){html,body{overflow:auto;height:auto}#app{height:auto}.cols{grid-template-columns:1fr}.cols>.pan{max-height:75vh}.set label{grid-template-columns:1fr}}
</style></head><body>
<main id="app">
<div class="hd"><h1>Email sheet validator</h1>
<p class="sub">Upload the main sheet (and the attachment sheet if the email carries one) as CSV exports from Google Sheets. Nothing leaves your browser. Every problem is marked on the exact cell and listed on the left.</p>
<div class="row">
 <label class="pan drop" id="dm"><b>Main sheet</b><small id="nm">Drop a .csv here or click to choose</small><input type="file" accept=".csv,.tsv,.txt"></label>
 <label class="pan drop" id="da"><b>Attachment sheet</b><small id="na">Only when the email has an attachment or inline table</small><input type="file" accept=".csv,.tsv,.txt"></label>
 <div class="pan set">
  <label>Email type<select id="mode"><option value="auto">Auto-detect from main sheet columns</option><option value="none">No attachment</option><option value="csv">CSV attachment (has_attachment + user_attachment_filter_key)</option><option value="table">Inline table (dynamic_table_N + table_filter_key)</option></select></label>
  <label>Empty email_template_id is<select id="tpl"><option value="warn">a warning</option><option value="error">an error</option><option value="ignore">ignored</option></select></label>
  <label>Blank / NA cells<select id="blank"><option value="error">flag as errors</option><option value="ignore">ignore</option></select></label>
  <label>Short-form headers (Res ID)<select id="abbr"><option value="error">flag as errors</option><option value="ignore">ignore</option></select></label>
  <label>Required sender domain<input type="text" id="dom" placeholder="zomato.com (optional)"></label>
 </div>
</div>
<div class="bar"><button class="pri" id="dl" disabled>Download report (CSV)</button><span id="msg" class="mu"></span></div></div>
<div class="cols">
 <div class="pan side"><div class="sp"><div id="stat"></div><div class="lbl">Show</div><div class="seg" id="fsev"></div><div class="seg" id="fsh"></div><input type="text" id="fq" placeholder="Search issues, e.g. cc_id or row 12"></div><div class="groups" id="groups"></div></div>
 <div class="pan"><div class="tb"><div class="tabs" id="tabs"></div><label><input type="checkbox" id="only" checked> Only rows with issues</label><div class="sp2"><span id="pg"></span><button id="pv">◀ Prev</button><button id="nx">Next ▶</button></div></div>
  <div class="ban" id="ban"></div><div class="wrap" id="grid"></div><div class="detail" id="detail"></div></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={main:null,att:null,issues:[],tab:'main',only:true,page:0,lim:300,focus:null,mode:'none'};
const add=(sh,r,c,sev,msg)=>S.issues.push({sh,r,c,sev,msg});
const norm=s=>s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const ERRV=/^(#N\/A|#REF!|#VALUE!|#DIV\/0!|#NAME\?|#NULL!|#NUM!|#ERROR!|Err:\d+)$/i,INV=/[\u00A0\u200B-\u200D\uFEFF]/,EM=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]{2,}$/;
function parseCSV(t){if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);const l=t.split('\n',1)[0],d=l.split('\t').length>l.split(',').length?'\t':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"'&&f==='')q=true;else if(c==d){row.push(f);f=''}
  else if(c=='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!='\r')f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function mk(name,rows){while(rows.length>1&&rows[rows.length-1].length===1&&rows[rows.length-1][0]==='')rows.pop();return{name,head:rows[0]||[],rows:rows.slice(1)}}
function load(k,file){const r=new FileReader();r.onload=()=>{S[k]=mk(file.name,parseCSV(r.result));$(k=='main'?'#nm':'#na').textContent=file.name+' · '+S[k].rows.length+' rows';$(k=='main'?'#dm':'#da').classList.add('has');S.page=0;run()};r.readAsText(file)}
const NAV=/^(na|n\/a|nan|none|nil|null|undefined)$/i;
const ABBR={res:'Restaurant',rest:'Restaurant',rst:'Restaurant',resto:'Restaurant',qty:'Quantity',amt:'Amount',amnt:'Amount',cust:'Customer',usr:'User',ord:'Order',addr:'Address',dt:'Date',desc:'Description',disc:'Discount',del:'Delivery',dlvry:'Delivery',txn:'Transaction',cat:'Category',tot:'Total',avg:'Average',pct:'Percentage',perc:'Percentage',prc:'Price',mob:'Mobile',ph:'Phone',loc:'Location',rtg:'Rating',ts:'Timestamp',cnt:'Count',val:'Value',pmt:'Payment',inv:'Invoice',exp:'Expiry',no:'Number',num:'Number'};
const ldx=sh=>{let k=-1;sh.rows.forEach((r,i)=>{if(r.some(x=>x.trim()!==''))k=i});return k};
function cell(sh,i,j,v,opt){const t=v.trim(),C=S.C;
 if(ERRV.test(t))add(sh,i,j,'error','Spreadsheet error value “'+t+'”');
 else if(NAV.test(t)&&C.blank!='ignore')add(sh,i,j,'error','“'+t+'” is a placeholder – fill in a real value');
 if(INV.test(v))add(sh,i,j,'error','Hidden character (non-breaking or zero-width space) in cell');
 else if(v!==t)add(sh,i,j,'error',t===''?'Cell contains only spaces – clear it':'Leading or trailing space in cell');
 else if(t===''&&!opt&&C.blank!='ignore')add(sh,i,j,'error','Blank cell – every cell must be filled')}
function hh(sh,key){const seen={};
 sh.head.forEach((h,j)=>{const t=h.trim(),has=sh.rows.some(r=>(r[j]||'').trim()!=='');
  if(t===''){if(has){add(key,-1,j,'error','Column has data but no header – the ETL will not read it');sh.rows.forEach((r,i)=>{if((r[j]||'').trim()!=='')add(key,i,j,'error','Data under a column with no header')})}else add(key,-1,j,'warn','Empty header column – delete it');return}
  if(h!==t)add(key,-1,j,'error','Header has leading or trailing spaces');
  const l=t.toLowerCase();if(seen[l]!==undefined)add(key,-1,j,'error','Duplicate header “'+t+'” (same as column '+(seen[l]+1)+')');else seen[l]=j});
 sh.rows.forEach((r,i)=>{r.forEach((v,j)=>{if(j>=sh.head.length&&v.trim()!=='')add(key,i,j,'error','Data in a cell beyond the last header column – the ETL will not read it')})})}
function col(sh,key,name,req){const t=sh.head.map(h=>h.trim());let j=t.indexOf(name);if(j>=0)return j;
 j=t.findIndex(h=>norm(h)===name);if(j>=0){add(key,-1,j,'error','Header must be exactly “'+name+'”');return j}
 if(req)add('all',-1,-1,'error',(key=='main'?'Main':'Attachment')+' sheet is missing required column “'+name+'”');return -1}
const idMsg=v=>/^\d+$/.test(v)?'':/^\d+\.0+$/.test(v)?'ID has a decimal part (“.0”) – remove it':/e\+?\d+$/i.test(v)?'ID is in scientific notation – format the column as plain number':'ID must be digits only';
function keyChk(sh,i,j,key,uid){if(/^\d+$/.test(key))add(sh,i,j,'error','Filter key is a plain number – it must be text (for example user_123456), not a plain number')}
function uniq(list,c,label,low){if(c<0||!list.length)return;const n=new Map;list.forEach(([i,v])=>{const k=low?v.toLowerCase():v;n.set(k,(n.get(k)||0)+1)});if(n.size<2)return;
 const top=[...n.entries()].sort((a,b)=>b[1]-a[1])[0][0],orig=list.find(([i,v])=>(low?v.toLowerCase():v)==top)[1];
 list.forEach(([i,v])=>{if((low?v.toLowerCase():v)!=top)add('main',i,c,'error','More than one '+label+' in this column – every row should use “'+orig+'”')})}
function run(){S.issues=[];const C={mode:$('#mode').value,tpl:$('#tpl').value,blank:$('#blank').value,abbr:$('#abbr').value,dom:$('#dom').value.trim().toLowerCase().replace(/^@/,'')};S.C=C;
 const M=S.main,A=S.att;if(!M){render();return}
 hh(M,'main');const mh=M.head.map(h=>h.trim()),hasN=n=>mh.some(t=>norm(t)===n);
 const ci={};['user_id','email_template_id','email_subject','sender_name','sender_email'].forEach(n=>ci[n]=col(M,'main',n,true));
 const fam={};mh.forEach((t,j)=>{let m;if(m=t.match(/^(bcc_id|cc_id|dynamic_table)_(\d+)$/))(fam[m[1]]??={})[+m[2]]=j;else if(m=t.match(/^var_(\d+)_(name|value)$/))((fam.var??={})[+m[1]]??={})[m[2]]=j});
 const tcols=Object.values(fam.dynamic_table||{});
 let mode=C.mode;if(mode=='auto')mode=(hasN('has_attachment')||hasN('user_attachment_filter_key'))?'csv':(tcols.length||hasN('table_filter_key'))?'table':'none';S.mode=mode;
 const csvN=['has_attachment','user_attachment_filter_key'],tabN=['table_filter_key'];
 const known=new Set(['user_id','email_template_id','email_subject','sender_name','sender_email',...csvN,...tabN]);
 mh.forEach((t,j)=>{const n=norm(t);if(t==='')return;
  if(mode=='none'&&(csvN.includes(n)||tabN.includes(n)||/^dynamic_table_\d+$/.test(t)))add('main',-1,j,'error','Not allowed when the email has no attachment – remove this column');
  else if(mode=='csv'&&(tabN.includes(n)||/^dynamic_table_\d+$/.test(t)))add('main',-1,j,'error','Inline-table column in a CSV-attachment sheet');
  else if(mode=='table'&&csvN.includes(n))add('main',-1,j,'error','CSV-attachment column in an inline-table sheet');
  else if(!known.has(t)&&!known.has(n)&&!/^(bcc_id|cc_id|dynamic_table)_\d+$|^var_\d+_(name|value)$/.test(t))add('main',-1,j,'warn','Unrecognised column – the ETL will probably ignore it')});
 for(const f of ['bcc_id','cc_id','dynamic_table','var']){const o=fam[f];if(!o)continue;const ns=Object.keys(o).map(Number),mx=Math.max(...ns);
  for(let k=1;k<mx;k++)if(!o[k]){const c=f=='var'?Object.values(o[mx])[0]:o[mx];add('main',-1,c,'warn',f+'_'+k+(f=='var'?'_name/value':'')+' is missing – numbering should be continuous from 1')}}
 for(const [n,p] of Object.entries(fam.var||{})){if(p.name===undefined)add('main',-1,p.value,'error','var_'+n+'_value has no matching var_'+n+'_name column');if(p.value===undefined)add('main',-1,p.name,'error','var_'+n+'_name has no matching var_'+n+'_value column')}
 let ha=-1,kc=-1,keyName=mode=='csv'?'user_attachment_filter_key':'table_filter_key',ai={};
 if(mode=='csv'){ha=col(M,'main','has_attachment',true);kc=col(M,'main',keyName,true)}
 if(mode=='table'){kc=col(M,'main',keyName,true);if(!tcols.length)add('all',-1,-1,'error','Main sheet needs at least one dynamic_table_1 column')}
 if(mode=='none'&&A)add('all',-1,-1,'error','An attachment sheet was uploaded, but the main sheet has no has_attachment / user_attachment_filter_key (or dynamic_table_N / table_filter_key) columns');
 if(mode!='none'&&!A)add('all',-1,-1,'error','Attachment sheet is required for this email type – upload it');
 const attE=new Map,attN=new Map,push=(m,k,i)=>{(m.get(k)||m.set(k,[]).get(k)).push(i)};
 const useA=A&&mode!='none';
 if(useA){hh(A,'att');ai.u=col(A,'att','user_id',true);ai.k=col(A,'att',keyName,true);if(mode=='table')ai.t=col(A,'att','table_name',true);
  const idc=[ai.u,ai.k,ai.t];const dc=A.head.map((h,j)=>j).filter(j=>!idc.includes(j)&&A.head[j].trim()!=='');
  if(!A.rows.length)add('all',-1,-1,'error','Attachment sheet has no data rows');if(!dc.length)add('all',-1,-1,'error','Attachment sheet has no data columns besides the identifier columns');
  dc.forEach(j=>{if(!A.rows.some(r=>(r[j]||'').trim()!==''))add('att',-1,j,'warn','Column is empty in every row')});
  if(C.abbr!='ignore')A.head.forEach((h,j)=>{if(idc.includes(j)||!h.trim())return;const bad=[...h.matchAll(/[A-Za-z]+/g)].filter(m=>ABBR[m[0].toLowerCase()]);if(bad.length)add('att',-1,j,'error','Use full words in headers: “'+h.trim()+'” → “'+h.trim().replace(/[A-Za-z]+/g,w=>ABBR[w.toLowerCase()]||w)+'”')});
  A.rows.forEach((r,i)=>{const g=(j)=>j>=0?(r[j]??'').trim():'';push(attE,g(ai.u)+'|'+g(ai.k)+'|'+(ai.t>=0?g(ai.t):''),i);push(attN,g(ai.u)+'|'+norm(g(ai.k))+'|'+(ai.t>=0?norm(g(ai.t)):''),i)})}
 const optM=new Set([ci.user_id,ci.email_template_id,ci.email_subject,ci.sender_name,ci.sender_email,ha,kc,tcols[0],...Object.values(fam.cc_id||{}),...Object.values(fam.bcc_id||{}),...Object.values(fam.var||{}).flatMap(p=>[p.name,p.value])]);
 const mainE=new Map,mainN=new Map,tabs=new Map,seenU=new Map,flagU=new Set,tpls={},sn=[],se2=[],vn={},vb={},ldM=ldx(M);
 M.rows.forEach((r,i)=>{const g=j=>j>=0?(r[j]??'').trim():'';
  if(r.every(x=>x.trim()==='')){add('main',i,-1,'error',i>ldM?'Blank or space-only row after the last data row – delete it':'Blank row between data rows – delete it');return}

  const uid=g(ci.user_id);if(ci.user_id>=0){if(!uid)add('main',i,ci.user_id,'error','user_id is empty');else{const m=idMsg(uid);if(m)add('main',i,ci.user_id,'error','user_id: '+m);

const sevRank={error:2,warn:1};
Object.assign(S,{sev:'all',sh:'all',q:'',open:null,gs:[],nav:[],ni:-1,sel:null,lim:100,sel2:null});
const colL=j=>{let s='';j++;while(j>0){const m=(j-1)%26;s=String.fromCharCode(65+m)+s;j=(j-m-1)/26}return s};
const gkey=m=>m.replace(/“[^”]*”/g,'“…”').replace(/\d+/g,'N');
const shN=sh=>sh=='main'?'Main':sh=='att'?'Attachment':'Whole sheet';
function colName(i){const d=S[i.sh];if(!d||i.c<0)return '';return (d.head[i.c]||'').trim()||'(no header)'}
function cref(i){return i.c>=0?colL(i.c)+(i.r<0?1:i.r+2):(i.r<0?'':'Row '+(i.r+2))}
function where(i){if(i.sh=='all')return 'Whole sheet';return shN(i.sh)+' · '+cref(i)+(i.c>=0?' · '+colName(i):'')}
function filt(){const q=S.q.toLowerCase();return S.issues.filter(i=>(S.sev=='all'||i.sev==S.sev)&&(S.sh=='all'||i.sh==S.sh||i.sh=='all')&&(!q||(i.msg+' '+where(i)).toLowerCase().includes(q)))}
function seg(el,cur,opts,key){$(el).innerHTML=opts.map(([v,l,n])=>'<button data-'+key+'="'+v+'" class="'+(cur==v?'act':'')+'">'+l+(n===undefined?'':' <span>'+n+'</span>')+'</button>').join('')}
function side(){const I=S.issues,M=S.main,er=I.filter(i=>i.sev=='error').length,wa=I.length-er;
 $('#stat').innerHTML=!M?'<span class="st mu">Upload the main sheet to begin.</span>':(er?'<span class="st bad">'+er+' error'+(er>1?'s':'')+' to fix</span>':'<span class="st ok">No errors – format looks valid</span>')+(wa?'<span class="st wr">'+wa+' warning'+(wa>1?'s':'')+' to review</span>':'')+'<div class="mu" style="font-size:12px">'+({none:'No attachment',csv:'CSV attachment',table:'Inline table'}[S.mode])+' · Main '+M.rows.length+' rows'+(S.att?' · Attachment '+S.att.rows.length+' rows':'')+'</div>';
 seg('#fsev',S.sev,[['all','All',I.length],['error','Errors',er],['warn','Warnings',wa]],'sev');
 seg('#fsh',S.sh,[['all','Both'],['main','Main sheet'],['att','Attachment']],'sh');
 const L=filt(),G=new Map;L.forEach(i=>{const k=i.sev+'|'+i.sh+'|'+gkey(i.msg);(G.get(k)||G.set(k,{k,sev:i.sev,sh:i.sh,items:[]}).get(k)).items.push(i)});
 S.gs=[...G.values()].sort((a,b)=>(sevRank[b.sev]-sevRank[a.sev])||b.items.length-a.items.length);
 S.nav=L.filter(i=>i.sh!='all').sort((a,b)=>(a.sh==b.sh?0:a.sh=='main'?-1:1)||a.r-b.r||a.c-b.c);
 $('#groups').innerHTML=S.gs.length?S.gs.map((g,gi)=>{const cols=[...new Set(g.items.map(colName).filter(Boolean))],open=S.open==g.k,n=g.items.length;
  return '<div class="grp"><button class="gh" data-gi="'+gi+'"><span class="dot '+g.sev+'"></span><span class="gt"><b>'+esc(n==1?g.items[0].msg:gkey(g.items[0].msg))+'</b><small>'+shN(g.sh)+(cols.length?' · '+esc(cols.slice(0,3).join(', '))+(cols.length>3?' +'+(cols.length-3):''):'')+'</small></span><span class="cnt">'+n+'</span></button>'+
  (open?'<ul class="items">'+g.items.slice(0,S.lim).map((i,ii)=>'<li data-gi="'+gi+'" data-ii="'+ii+'">'+esc(where(i).replace(/^(Main|Attachment|Whole sheet) · /,''))+(n>1&&i.msg!=gkey(i.msg)?' <i>– '+esc(i.msg)+'</i>':'')+'</li>').join('')+(n>S.lim?'<li class="mu" data-more="1">Show more ('+(n-S.lim)+' left)</li>':'')+'</ul>':'')+'</div>'}).join(''):'<div class="empty">'+(M?'No issues match these filters.':'Issues will be grouped here by type.')+'</div>'}
function render(){side();const cn=sh=>S.issues.filter(i=>i.sh==sh).length;

  if(el){W.scrollTo({left:Math.max(0,el.offsetLeft-W.clientWidth/2+el.offsetWidth/2),top:f.r<0?0:Math.max(0,el.offsetTop-W.clientHeight/2)});el.classList.add('pulse')}detail(f.sh,f.r,f.c)}
 else if(!S.keepDetail)detail();S.keepDetail=false}
function detail(sh,r,c){const a=sh?S.issues.filter(i=>i.sh==sh&&i.r==r&&(i.c==c||(i.c<0&&r>=0&&c>=0))):[];
 $('#detail').innerHTML=a.length?a.map(i=>'<div class="'+i.sev+'"><b>'+(i.sev=='error'?'Error':'Warning')+'</b> · '+esc(where(i))+' — '+esc(i.msg)+'</div>').join(''):'<span class="mu">Click a highlighted cell to see what’s wrong, or use Prev / Next to step through the issues.</span>'}
function grid(sh){const d=S[sh];if(!d)return '<p class="empty">'+(sh=='att'?'No attachment sheet uploaded.':'Upload the main sheet to see it here.')+'</p>';
 const by=new Map,rows=new Set,rs={};S.issues.forEach(i=>{if(i.sh!=sh)return;const k=i.r+'|'+i.c;(by.get(k)||by.set(k,[]).get(k)).push(i);if(i.r>=0){rows.add(i.r);if(i.c<0)rs[i.r]=(rs[i.r]=='e'||i.sev=='error')?'e':'w'}});

 h+='</tr></thead><tbody>';
 vis.forEach(i=>{const ra=by.get(i+'|-1'),t=rs[i]?' r'+rs[i]:'';h+='<tr><td class="rn '+cls(ra)+'" id="r-'+sh+'-'+i+'"'+tip(ra)+'>'+(i+2)+'</td>';
  for(let j=0;j<w;j++){const a=by.get(i+'|'+j);h+='<td id="c-'+sh+'-'+i+'-'+j+'" class="'+(cls(a)||t.trim())+'"'+tip(a)+'>'+esc(d.rows[i][j]??'')+'</td>'}h+='</tr>'});
 return h+'</tbody></table>'+(idx.length?'':'<p class="empty">'+(S.issues.some(i=>i.sh==sh)?'No row-level issues on this sheet – see the header row or the notes above.':'No issues on this sheet.')+'</p>')}
function jump(i){S.tab=i.sh;S.focus={sh:i.sh,r:i.r,c:i.c};S.ni=S.nav.indexOf(i);render()}
function step(d){if(!S.nav.length)return;S.ni=(S.ni+d+S.nav.length)%S.nav.length;jump(S.nav[S.ni])}
function csvEsc(v){v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function reportCSV(){const rows=[['Sheet','Cell','Row','Column','Severity','Issue','Cell value']];
 [...S.issues].sort((a,b)=>(sevRank[b.sev]-sevRank[a.sev])||a.sh.localeCompare(b.sh)||a.r-b.r||a.c-b.c).forEach(i=>{const d=S[i.sh],v=d&&i.r>=0&&i.c>=0?(d.rows[i.r][i.c]??''):'';
